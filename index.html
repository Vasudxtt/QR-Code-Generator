<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <p>Enter Your Text or URL</p>
    <input type="text" placeholder="Text or URL" id="qrText">
    <div id="imgBox">
      <img id="qrImage" src="" alt="QR Code">
    </div>
    <button onclick="generateQR()">Generate QR Code</button>
  </div>
  <script>
    let imgBox = document.getElementById("imgBox");
    let qrImage = document.getElementById("qrImage");
    let qrText = document.getElementById("qrText");

    function generateQR() {
      if (qrText.value.length > 0) {
        const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(qrText.value);
        qrImage.src = qrUrl;
        imgBox.classList.add("show-img");
        console.log("QR Code URL:", qrUrl); // Debug: Log the URL
      } else {
        qrText.classList.add('error');
        setTimeout(() => {
          qrText.classList.remove('error');
        }, 1000);
        console.log("Input is empty"); // Debug: Log empty input
      }
    }

    // Allow generating QR code by pressing Enter
    qrText.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        generateQR();
      }
    });
  </script>
</body>
</html>
